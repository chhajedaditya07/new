name: CI

on:
  push:
    branches: [ "claude/**", main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StoreManager.sln

      - name: Build (includes the WinUI app and its XAML)
        run: dotnet build StoreManager.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/StoreManager.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish self-contained app
        run: dotnet publish src/StoreManager.App -c Release -r win-x64 --self-contained -o publish/StoreManager

      - name: Smoke test (start the published app and check it stays up and creates its database)
        shell: pwsh
        run: |
          $data = Join-Path $PWD "smoke-data"
          $env:STOREMANAGER_DATA = $data
          $p = Start-Process -FilePath "publish\StoreManager\StoreManager.exe" -PassThru
          Start-Sleep -Seconds 25
          $failed = $false
          if ($p.HasExited) { Write-Host "::error::App exited early with code $($p.ExitCode)"; $failed = $true }
          else { Write-Host "App still running after 25s (window title: '$($p.MainWindowTitle)')" }
          if (-not (Test-Path (Join-Path $data "store.db"))) { Write-Host "::error::store.db was not created"; $failed = $true }
          else { Write-Host "store.db created: $((Get-Item (Join-Path $data 'store.db')).Length) bytes" }
          Get-ChildItem (Join-Path $data "logs") -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "---- $($_.Name)"; Get-Content $_.FullName }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if ($failed) { exit 1 }

      - name: Upload app (unzip and run StoreManager.exe)
        uses: actions/upload-artifact@v4
        with:
          name: StoreManager-win-x64
          path: publish/StoreManager
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/results.trx"
